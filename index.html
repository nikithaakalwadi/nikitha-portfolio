<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F6F3; --ink:#FFF8EC;
  --home:#5C1F30; --work:#E5A445; --resume:#5E8FD1; --about:#E7879F; --contact:#5E9670;
  --c:var(--home);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Outfit',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.folder{width:100%;max-width:860px}
.tabs{display:flex;gap:4px;padding-left:10px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font:600 12px/1 'Outfit',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;border:0;cursor:pointer;
  padding:12px 20px 10px;border-radius:12px 12px 0 0;background:var(--t);opacity:.92;transform:translateY(3px);
  transition:transform .2s,padding .2s,opacity .2s;white-space:nowrap}
.tab:hover{transform:translateY(0)}
.tab[aria-selected="true"]{padding-top:16px;padding-bottom:12px;transform:translateY(0);opacity:1}
.tab:focus-visible{outline:3px solid #fff;outline-offset:-4px}
.panel{background:var(--c);border-radius:16px;min-height:min(544px,70vh);padding:clamp(24px,5vw,56px);color:var(--ink);
  transition:background .35s ease;position:relative;overflow:hidden}
.panel h1{font:700 clamp(36px,7vw,72px)/1 'Outfit',sans-serif;margin:0 0 16px;letter-spacing:-.01em}
.panel p{font-size:clamp(16px,2vw,19px);line-height:1.6;max-width:56ch;margin:0 0 12px}
.dark-ink .panel,.panel.dark{color:#2A1A10}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:24px}
.card{background:rgba(255,255,255,.22);border-radius:12px;padding:18px;min-height:110px}
.card b{font:600 18px 'Outfit',sans-serif;display:block;margin-bottom:6px}
a.btn,button.btn{border:0;margin-top:14px;cursor:pointer;font:500 16px 'Outfit',sans-serif;display:inline-block;margin-top:14px;padding:12px 22px;border-radius:999px;background:var(--ink);color:#2A1A10;font-weight:500;text-decoration:none}
.panel.dark a.btn,.panel.dark button.btn{background:#2A1A10;color:#fff}
.sec{margin-top:32px}
.sec h2{font:600 clamp(22px,3vw,30px)/1.1 'Outfit',sans-serif;margin:0 0 4px}
.meta{display:block;font-size:14px;opacity:.85;margin-bottom:10px}
.card ul{margin:0;padding-left:18px;font-size:15px;line-height:1.5}
.card li{margin-bottom:4px}
.pick{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:0;padding:16px 18px;transition:background .2s}
.pick:hover{background:rgba(255,255,255,.4)}
.pick:focus-visible{outline:3px solid currentColor;outline-offset:2px}
.back{border:0;background:rgba(255,255,255,.25);color:inherit;font:500 15px 'Outfit',sans-serif;padding:8px 16px;border-radius:999px;cursor:pointer;margin-bottom:20px}
.back:hover{background:rgba(255,255,255,.4)}
a.pick{display:block;text-decoration:none}
.pick .meta{overflow-wrap:anywhere;margin-bottom:0}
.grid.wide{grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr))}
.pick .meta.mail{white-space:nowrap;overflow-wrap:normal;font-size:clamp(12px,3.6vw,14px)}
.stars{position:absolute;inset:-48px;pointer-events:none;z-index:2}
.stars svg{position:absolute}
.view{animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.panel,.tab{transition:none}}
</style>
</head>
<body>
<main class="folder">
  <div class="tabs" role="tablist" aria-label="Portfolio sections"></div>
  <section class="panel" id="panel" role="tabpanel"></section>
</main>

   html:`<h1>Resume</h1><div class="grid"><div class="card"><b>Profile</b><ul><li>UX design student skilled in user research, wireframing and prototyping.</li><li>Designs ergonomic, digital solutions through iterative testing, with a focus on usability and accessibility.</li></ul></div><div class="card"><b>Bachelor of Design (UX Design)</b><span class="meta">MIT Institute of Design · Expected graduation 2027 · Pune</span><ul><li>Focuses on human behaviour, needs and decision-making, applied to products, systems and services.</li><li>Combines theory, observation and hands-on projects.</li><li>Emphasises critical thinking, problem framing and iteration.</li></ul></div><div class="card"><b>Bitla Software</b><span class="meta">UX Design Internship · May – July 2026 · On-site, Bangalore</span><ul><li>Designed responsive homepage templates that are consistent with the brand and easy to use.</li><li>Created logo concepts and analysed the platform’s user journeys, interface patterns and features.</li></ul></div><div class="card"><b>Bangalore Creative Circus</b><span class="meta">Social Media and Events Internship · December 2025 · On-site, Bangalore</span><ul><li>Created reels and posts for events with the Creative Director.</li><li>Helped with on-ground coordination, management and décor.</li></ul></div><div class="card"><b>0101DigitAll</b><span class="meta">UX Design Internship · July – October 2025 · Remote</span><ul><li>Worked on screen iterations for the application.</li><li>Developed user flows for a web application from the business analyst’s insights.</li></ul></div><div class="card"><b>Extracurricular activities</b><span class="meta">MIT Institute of Design · Pune</span><ul><li>Club DIVE: Treasurer, 2023 – 27</li><li>UX Social Media Team: Member, 2024 – 27</li></ul></div></div><button class="btn" id="dl" type="button">Download resume</button>`},

const tabs=document.querySelector('.tabs'), panel=document.getElementById('panel');
sections.forEach(s=>{
  const b=document.createElement('button');
  b.className='tab';b.role='tab';b.id='tab-'+s.id;b.textContent=s.label;
  b.style.setProperty('--t',s.color);b.dataset.id=s.id;
  b.onclick=()=>select(s.id);tabs.appendChild(b);
});
function select(id,sub){
  const s=sections.find(x=>x.id===id)||sections[0];
  document.documentElement.style.setProperty('--c',s.color);
  panel.classList.toggle('dark',s.dark);
  panel.innerHTML='<div class="view">'+((id==='work'&&workPages[sub])?workPages[sub]:s.html)+'</div>';
  panel.setAttribute('aria-labelledby','tab-'+s.id);
  tabs.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===s.id));
  const dl=document.getElementById('dl');
  if(dl)dl.onclick=async()=>{
    try{
      const d=await claude.use('downloads');
      if(!d){dl.textContent='Download unavailable here';dl.disabled=true;return}
      const bin=atob(RESUME_PDF),u=new Uint8Array(bin.length);
      for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);
      await d.save({filename:'Nikitha_Akalwadi_Resume.pdf',data:new Blob([u],{type:'application/pdf'})});
    }catch(e){console.error(e)}
  };
  panel.querySelectorAll('[data-sub]').forEach(a=>a.onclick=()=>{select('work',a.dataset.sub);window.scrollTo(0,0)});
  panel.querySelectorAll('[data-back]').forEach(a=>a.onclick=()=>select('work'));
  panel.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();select(a.dataset.go)});
  renderStars(s.id==='contact');
  try{history.replaceState(null,'','#'+s.id+(workPages[sub]&&id==='work'?'/'+sub:''))}catch(e){}
}

function renderStars(on){
  const folder=document.querySelector('.folder');
  const old=folder.querySelector('.stars'); if(old)old.remove();
  if(!on)return;
  const L=document.createElement('div');L.className='stars';L.setAttribute('aria-hidden','true');
  folder.appendChild(L);
  const lr=L.getBoundingClientRect();
  const textRect=e=>{const r=document.createRange();r.selectNodeContents(e);return r.getBoundingClientRect()};
  const blocks=[...panel.querySelectorAll('h1,p')].map(textRect)
    .concat([...panel.querySelectorAll('a.pick')].map(e=>e.getBoundingClientRect()))
    .concat([...tabs.querySelectorAll('.tab')].map(e=>e.getBoundingClientRect()));
  const placed=[];let tries=0,html='';
  while(placed.length<32&&tries<600){
    tries++;
    const size=8+Math.random()*24;
    const x=Math.random()*(lr.width-size),y=Math.random()*(lr.height-size);
    const m=10,bx={l:lr.left+x-m,t:lr.top+y-m,r:lr.left+x+size+m,b:lr.top+y+size+m};
    if(bx.l<4||bx.r>innerWidth-4)continue;
    if(blocks.some(r=>bx.l<r.right&&bx.r>r.left&&bx.t<r.bottom&&bx.b>r.top))continue;
    if(placed.some(q=>bx.l<q.r&&bx.r>q.l&&bx.t<q.b&&bx.b>q.t))continue;
    placed.push(bx);
    html+=`<svg viewBox="0 0 24 24" width="${size.toFixed(1)}" height="${size.toFixed(1)}" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;transform:rotate(${Math.round(Math.random()*72)}deg)"><path d="M12 1.5l3 7.2 7.7.6-5.9 5 1.9 7.5L12 17.7 5.3 21.8l1.9-7.5-5.9-5 7.7-.6z" fill="#E5A445"/></svg>`;
  }
  L.innerHTML=html;
}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>renderStars(panel.getAttribute('aria-labelledby')==='tab-contact'));
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>renderStars(panel.getAttribute('aria-labelledby')==='tab-contact'),200)});
const h=location.hash.slice(1).split('/');select(h[0]||'home',h[1]);
</script>
